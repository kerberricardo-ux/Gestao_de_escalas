<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinela - Gestão de Escalas Operacionais</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --danger: #ef4444;
            --warning: #f97316;
            --info: #3b82f6;
            --border: #333;
            --cor-t: #22c55e;
            --cor-fo: #000000;
            --cor-f: #ef4444;
            --cor-su: #ea580c;
            --cor-at: #06b6d4;
            --cor-fe: #3b82f6;
            --cor-hi: #16a34a;
            --cor-fg: #84cc16;
            --cor-c: #f97316;
            --cor-af: #8b5cf6;
            --cor-tc: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 220px;
            background: #000;
            padding: 20px;
            position: fixed;
            height: 100vh;
            border-right: 1px solid var(--border);
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1rem;
            color: var(--accent);
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .sidebar button {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 15px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 8px;
            transition: 0.3s;
            margin-bottom: 5px;
        }

        .sidebar button:hover,
        .sidebar button.active-nav {
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent);
        }

        .content {
            margin-left: 220px;
            padding: 30px;
            width: calc(100% - 220px);
        }

        section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Estilos existentes (mantidos iguais) */
        .search-container {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-container .material-icons {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 20px;
        }

        .search-input {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 15px 10px 40px;
            border-radius: 20px;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(0, 230, 118, 0.2);
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .form-container {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        input, select {
            background: #2c2c2c;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 5px;
            flex: 1;
            min-width: 150px;
        }

        .btn-add, .btn-edit, .btn-save, .btn-cancel {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 5px;
        }

        .btn-edit, .btn-save { background: var(--info); }
        .btn-cancel { background: var(--warning); color: white; }
        .btn-remove { background: var(--danger); color: white; }

        .list-item {
            background: var(--bg-card);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Novos estilos para status */
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
        }

        .status-ativo { background: #22c55e; color: #000; }
        .status-inativo { background: #555; color: #ddd; }
        .status-afastado { background: var(--cor-af); color: white; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">SENTINELA GESTÃO DE ESCALAS</div>
        <button onclick="showSection('dashboard_gerencial')" id="nav-dashboard_gerencial" class="active-nav">
            <span class="material-icons">analytics</span>
            <span>Gerencial</span>
        </button>
        <button onclick="showSection('dashboard')" id="nav-dashboard">
            <span class="material-icons">monitor_heart</span>
            <span>Tempo Real</span>
        </button>
        <button onclick="showSection('postos')" id="nav-postos">
            <span class="material-icons">business</span>
            <span>Postos</span>
        </button>
        <button onclick="showSection('equipe')" id="nav-equipe">
            <span class="material-icons">groups</span>
            <span>Equipe</span>
        </button>
    </nav>

    <main class="content">

        <!-- Outras seções mantidas iguais (resumidas para brevidade) -->
        <!-- ... dashboard_gerencial, dashboard, postos ... -->

        <section id="equipe">
            <div class="stats-header">
                <h2>Gestão de Agentes</h2>
                <div class="search-container">
                    <span class="material-icons">search</span>
                    <input type="text" id="search-equipe" class="search-input" 
                           placeholder="Pesquisar por nome ou posto..." onkeyup="filterEquipe()">
                </div>
            </div>

            <div class="form-container">
                <input type="text" id="func-nome" placeholder="Nome Completo">
                <select id="func-posto-select"></select>
                <select id="func-escala">
                    <option value="12x36">12x36</option>
                    <option value="2x1">2x1</option>
                    <option value="5x1">5x1</option>
                    <option value="6x1">6x1</option>
                    <option value="4x2">4x2</option>
                </select>
                <input type="date" id="func-inicio">
                <button class="btn-add" onclick="addAgente()">Cadastrar</button>
            </div>

            <div id="lista-equipe"></div>
        </section>

        <!-- Modais -->
        <div id="modal-escala" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-titulo">Escala</h3>
                    <span class="close" onclick="closeModal()">×</span>
                </div>
                <div class="escala-container" id="escala-content"></div>
            </div>
        </div>

        <div id="modal-edit-agente" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-edit-titulo">Editar Agente</h3>
                    <span class="close" onclick="closeEditModal()">×</span>
                </div>
                <form class="form-container" id="form-edit-agente">
                    <input type="hidden" id="edit-agente-id">
                    <input type="text" id="edit-agente-nome" placeholder="Nome Completo" required>
                    <select id="edit-agente-posto" required></select>
                    <select id="edit-agente-escala" required>
                        <option value="12x36">12x36</option>
                        <option value="2x1">2x1</option>
                        <option value="5x1">5x1</option>
                        <option value="6x1">6x1</option>
                        <option value="4x2">4x2</option>
                    </select>
                    <input type="date" id="edit-agente-inicio" required>
                    <select id="edit-agente-status">
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                        <option value="afastado">Afastado</option>
                    </select>
                </form>
                <div style="display: flex; gap: 10px; justify-content: flex-end; padding: 10px;">
                    <button class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
                    <button class="btn-save" onclick="saveEditAgente()">Salvar</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = 'https://odvzkosujluparkblizr.supabase.co';
        const SB_KEY = 'sb_publishable_K_SPgZndx26WP11_tt6fsw_dmsD7Zou';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let localDB = { postos: [], equipe: [], ocorrencias: {}, coberturas: {} };
        let dataSelecionada = new Date();

        function formatarDataISO(data) {
            const ano = data.getFullYear();
            const mes = String(data.getMonth() + 1).padStart(2, '0');
            const dia = String(data.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function atualizarDataDisplay() {
            const format = { day: '2-digit', month: 'long', year: 'numeric' };
            document.getElementById('current-date').innerText = dataSelecionada.toLocaleDateString('pt-BR', format);
            document.getElementById('current-date-gerencial').innerText = dataSelecionada.toLocaleDateString('pt-BR', format);
        }

        function alterarDia(dias) {
            dataSelecionada.setDate(dataSelecionada.getDate() + dias);
            atualizarDataDisplay();
            renderAll();
        }

        async function sync() {
            try {
                const { data: p } = await _supabase.from('postos').select('*').order('nome');
                const { data: e } = await _supabase.from('equipe').select('*').order('nome');
                const { data: o } = await _supabase.from('ocorrencias').select('*');
                const { data: c } = await _supabase.from('coberturas').select('*');

                localDB.postos = p || [];
                localDB.equipe = e || [];
                localDB.ocorrencias = {};
                localDB.coberturas = {};

                o?.forEach(occ => {
                    localDB.ocorrencias[`${occ.agente_id}-${occ.data}`] = occ.sigla;
                });
                c?.forEach(cob => {
                    localDB.coberturas[`${cob.posto_id}-${cob.data}`] = cob.nome;
                });

                renderAll();
            } catch (err) {
                console.error(err);
            }
        }

        function isTrabalho(data, inicio, escala) {
            // ... (mantida igual)
            const dI = new Date(inicio + 'T00:00:00');
            const dA = new Date(data + 'T00:00:00');
            const diff = Math.floor((dA - dI) / 86400000);
            if (diff < 0) return false;
            switch (escala) {
                case '12x36': return diff % 2 === 0;
                case '2x1': return diff % 3 < 2;
                case '5x1': return diff % 6 < 5;
                case '6x1': return diff % 7 < 6;
                case '4x2': return diff % 6 < 4;
                default: return false;
            }
        }

        function filterEquipe() {
            const termo = document.getElementById('search-equipe').value.toLowerCase();
            const items = document.querySelectorAll('#lista-equipe .list-item');
            items.forEach(item => {
                const texto = item.textContent.toLowerCase();
                item.style.display = texto.includes(termo) ? "" : "none";
            });
        }

        function renderAll() {
            // ... (outras renderizações mantidas)

            // Renderização da Equipe com botões Inativo e Afastado
            const listaEquipe = document.getElementById('lista-equipe');
            listaEquipe.innerHTML = localDB.equipe.map(e => {
                const postoNome = localDB.postos.find(p => p.id === e.posto_id)?.nome || 'Sem Posto';
                const status = e.status || 'ativo';

                let badge = '';
                if (status === 'inativo') {
                    badge = `<span class="status-badge status-inativo">INATIVO</span>`;
                } else if (status === 'afastado') {
                    badge = `<span class="status-badge status-afastado">AFASTADO</span>`;
                }

                return `
                    <div class="list-item">
                        <span>
                            ${e.nome} — ${postoNome} (${e.escala}) 
                            ${badge}
                        </span>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button class="btn-edit" onclick="editAgente('${e.id}')">Editar</button>
                            
                            ${status !== 'inativo' ? 
                                `<button onclick="alterarStatus('${e.id}', 'inativo')" 
                                    style="background:#555; color:white; border:none; padding:8px 14px; border-radius:5px; cursor:pointer; font-size:0.82rem;">
                                    Inativo
                                </button>` : ''}
                            
                            ${status !== 'afastado' ? 
                                `<button onclick="alterarStatus('${e.id}', 'afastado')" 
                                    style="background:var(--cor-af); color:white; border:none; padding:8px 14px; border-radius:5px; cursor:pointer; font-size:0.82rem;">
                                    Afastado
                                </button>` : ''}
                            
                            <button class="btn-remove" onclick="removeAgente('${e.id}')">Remover</button>
                        </div>
                    </div>`;
            }).join('');

            // Atualiza selects de postos (mantido)
            const selectPostos = localDB.postos.map(p => 
                `<option value="${p.id}">${p.nome}</option>`
            ).join('');
            document.getElementById('func-posto-select').innerHTML = '<option value="">Posto...</option>' + selectPostos;
        }

        // ====================== NOVAS FUNÇÕES ======================

        async function alterarStatus(agenteId, novoStatus) {
            const texto = novoStatus === 'inativo' ? 'INATIVO' : 'AFASTADO';
            if (!confirm(`Deseja marcar este agente como ${texto}?`)) return;

            try {
                await _supabase.from('equipe')
                    .update({ status: novoStatus })
                    .eq('id', agenteId);

                await sync();
            } catch (err) {
                console.error(err);
                alert("Erro ao atualizar o status do agente.");
            }
        }

        async function addAgente() {
            const nome = document.getElementById('func-nome').value.trim();
            const posto_id = document.getElementById('func-posto-select').value;
            const escala = document.getElementById('func-escala').value;
            const inicio = document.getElementById('func-inicio').value;

            if (nome && posto_id && inicio) {
                try {
                    await _supabase.from('equipe').insert([{
                        nome,
                        posto_id,
                        escala,
                        inicio,
                        status: 'ativo'   // default
                    }]);
                    document.getElementById('func-nome').value = '';
                    document.getElementById('func-inicio').value = '';
                    await sync();
                } catch (err) {
                    console.error(err);
                }
            }
        }

        function editAgente(id) {
            const agente = localDB.equipe.find(a => a.id === id);
            if (!agente) return;

            document.getElementById('edit-agente-id').value = agente.id;
            document.getElementById('edit-agente-nome').value = agente.nome;
            document.getElementById('edit-agente-escala').value = agente.escala;
            document.getElementById('edit-agente-inicio').value = agente.inicio || '';
            document.getElementById('edit-agente-status').value = agente.status || 'ativo';

            const select = document.getElementById('edit-agente-posto');
            select.innerHTML = document.getElementById('func-posto-select').innerHTML;
            select.value = agente.posto_id;

            document.getElementById('modal-edit-agente').style.display = 'block';
        }

        async function saveEditAgente() {
            const id = document.getElementById('edit-agente-id').value;
            const dados = {
                nome: document.getElementById('edit-agente-nome').value.trim(),
                posto_id: document.getElementById('edit-agente-posto').value,
                escala: document.getElementById('edit-agente-escala').value,
                inicio: document.getElementById('edit-agente-inicio').value,
                status: document.getElementById('edit-agente-status').value
            };

            if (dados.nome && dados.posto_id && dados.inicio) {
                try {
                    await _supabase.from('equipe').update(dados).eq('id', id);
                    closeEditModal();
                    await sync();
                } catch (err) {
                    console.error(err);
                }
            }
        }

        function closeEditModal() {
            document.getElementById('modal-edit-agente').style.display = 'none';
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active-nav'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('active-nav');
        }

        function closeModal() {
            document.getElementById('modal-escala').style.display = 'none';
        }

        // Inicialização
        window.onload = () => {
            atualizarDataDisplay();
            sync();
        };

        window.onclick = (e) => {
            if (e.target.className === 'modal') {
                closeModal();
                closeEditModal();
            }
        };
    </script>
</body>
</html>
