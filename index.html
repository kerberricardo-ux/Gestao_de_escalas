<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinela - Gestão de Escalas Operacionais</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --danger: #ef4444;
            --warning: #f97316;
            --info: #3b82f6;
            --border: #333;
            --cor-t: #22c55e;
            --cor-fo: #444;
            --cor-f: #ef4444;
            --cor-su: #ea580c;
            --cor-at: #06b6d4;
            --cor-fe: #3b82f6;
            --cor-hi: #16a34a;
            --cor-fg: #84cc16;
            --cor-c: #f97316;
            --cor-af: #8b5cf6; /* Cor para Afastado */
            --cor-in: #6b7280; /* Cor para Inativo */
            --cor-tc: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body { background-color: var(--bg-dark); color: var(--text-primary); display: flex; min-height: 100vh; }

        .sidebar { width: 220px; background: #000; padding: 20px; position: fixed; height: 100vh; border-right: 1px solid var(--border); z-index: 100; }
        .logo { font-weight: 800; font-size: 1rem; color: var(--accent); margin-bottom: 40px; text-align: center; letter-spacing: 1.5px; text-transform: uppercase; }
        .sidebar button { width: 100%; background: none; border: none; color: var(--text-secondary); padding: 15px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; }
        .sidebar button:hover, .sidebar button.active-nav { background: rgba(0, 230, 118, 0.1); color: var(--accent); }

        .content { margin-left: 220px; padding: 30px; width: calc(100% - 220px); }
        section { display: none; animation: fadeIn 0.3s ease; }
        section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .search-container { flex: 1; max-width: 400px; position: relative; }
        .search-container .material-icons { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 20px; }
        .search-input { width: 100%; background: #1e1e1e; border: 1px solid var(--border); color: white; padding: 10px 15px 10px 40px; border-radius: 20px; outline: none; transition: 0.3s; }

        .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .stat-card .value { font-size: 2.2rem; font-weight: bold; }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 25px; border-radius: 12px; border-left: 6px solid var(--danger); cursor: pointer; transition: 0.2s; position: relative; min-height: 120px; }
        .card.active-status { border-left-color: var(--accent); }

        .form-container { background: var(--bg-card); padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        input, select { background: #2c2c2c; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 5px; flex: 1; min-width: 150px; }

        .btn-add, .btn-edit, .btn-save, .btn-cancel, .btn-action { color: #000; font-weight: bold; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; transition: 0.2s; font-size: 0.8rem; }
        .btn-add { background: var(--accent); }
        .btn-edit { background: var(--info); color: white; }
        .btn-remove { background: var(--danger); color: white; }
        .btn-inactive { background: #6b7280; color: white; } /* Cinza */
        .btn-afastado { background: var(--cor-af); color: white; } /* Roxo */

        .list-item { background: var(--bg-card); padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid var(--border); }
        .list-item:hover { border-color: var(--accent); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { background: var(--bg-card); margin: 2% auto; padding: 20px; width: 95%; max-width: 1400px; max-height: 95vh; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        
        .sigla-cell { font-size: 0.85rem; font-weight: bold; min-height: 36px; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .sigla-T { background: var(--cor-t); color: white; }
        .sigla-AF { background: var(--cor-af); color: white; }
        .sigla-IN { background: var(--cor-in); color: white; }
        .sigla-F { background: var(--cor-f); color: white; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">SENTINELA GESTÃO</div>
        <button onclick="showSection('dashboard_gerencial')" id="nav-dashboard_gerencial" class="active-nav"><span class="material-icons">analytics</span> Gerencial</button>
        <button onclick="showSection('dashboard')" id="nav-dashboard"><span class="material-icons">monitor_heart</span> Tempo Real</button>
        <button onclick="showSection('postos')" id="nav-postos"><span class="material-icons">business</span> Postos</button>
        <button onclick="showSection('equipe')" id="nav-equipe"><span class="material-icons">groups</span> Equipe</button>
    </nav>

    <main class="content">
        <section id="dashboard_gerencial" class="active">
            <div class="stats-header"><h2>Resumo Gerencial</h2><div id="current-date-gerencial"></div></div>
            <div class="stats-grid" id="stats-grid-container">
                <div class="stat-card"><h3>Postos</h3><div class="value" id="stat-postos">0</div></div>
                <div class="stat-card"><h3>Equipe</h3><div class="value" id="stat-agentes">0</div></div>
                <div class="stat-card"><h3>Faltas</h3><div class="value" id="stat-faltas">0</div></div>
            </div>
            <div id="lista-unidades-gestao"></div>
        </section>

        <section id="dashboard">
            <header class="stats-header">
                <h2>Painel Operacional</h2>
                <div class="search-container">
                    <span class="material-icons">search</span>
                    <input type="text" id="search-postos" class="search-input" placeholder="Pesquisar posto..." onkeyup="filterCards()">
                </div>
                <div id="current-date"></div>
            </header>
            <div id="cards-container" class="grid-cards"></div>
        </section>

        <section id="postos">
            <h2>Gestão de Unidades</h2>
            <div class="form-container">
                <input type="text" id="posto-nome" placeholder="Nome da Unidade">
                <input type="number" id="posto-minimo" placeholder="Mínimo">
                <button class="btn-add" onclick="addPosto()">Criar Posto</button>
            </div>
            <div id="lista-postos"></div>
        </section>

        <section id="equipe">
            <div class="stats-header">
                <h2>Gestão de Agentes</h2>
                <div class="search-container">
                    <span class="material-icons">search</span>
                    <input type="text" id="search-equipe" class="search-input" placeholder="Pesquisar agente..." onkeyup="filterEquipe()">
                </div>
            </div>
            <div class="form-container">
                <input type="text" id="func-nome" placeholder="Nome Completo">
                <select id="func-posto-select"></select>
                <select id="func-escala">
                    <option value="12x36">12x36</option>
                    <option value="5x1">5x1</option>
                    <option value="6x1">6x1</option>
                </select>
                <input type="date" id="func-inicio">
                <button class="btn-add" onclick="addAgente()">Cadastrar</button>
            </div>
            <div id="lista-equipe"></div>
        </section>

        <div id="modal-escala" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-titulo">Escala</h3>
                    <span style="cursor:pointer" onclick="closeModal()">[FECHAR]</span>
                </div>
                <div id="escala-content"></div>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = 'https://odvzkosujluparkblizr.supabase.co';
        const SB_KEY = 'sb_publishable_K_SPgZndx26WP11_tt6fsw_dmsD7Zou';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let localDB = { postos: [], equipe: [], ocorrencias: {}, coberturas: {} };
        let dataSelecionada = new Date();

        async function sync() {
            const { data: p } = await _supabase.from('postos').select('*').order('nome');
            const { data: e } = await _supabase.from('equipe').select('*').order('nome');
            const { data: o } = await _supabase.from('ocorrencias').select('*');
            
            localDB.postos = p || [];
            localDB.equipe = e || [];
            localDB.ocorrencias = {};
            o?.forEach(occ => { localDB.ocorrencias[`${occ.agente_id}-${occ.data}`] = occ.sigla; });
            renderAll();
        }

        function renderAll() {
            const container = document.getElementById('lista-equipe');
            container.innerHTML = localDB.equipe.map(e => {
                const posto = localDB.postos.find(p => p.id === e.posto_id)?.nome || '<span style="color:var(--warning)">NÃO ALOCADO</span>';
                return `
                <div class="list-item">
                    <span><strong>${e.nome}</strong><br><small>${posto} | ${e.escala}</small></span>
                    <div style="display:flex; gap:5px;">
                        <button class="btn-action btn-afastado" onclick="setAfastado('${e.id}')">Afastar</button>
                        <button class="btn-action btn-inactive" onclick="setInativo('${e.id}')">Inativar</button>
                        <button class="btn-edit" onclick="editAgente('${e.id}')">Editar</button>
                        <button class="btn-remove" onclick="removeAgente('${e.id}')">Excluir</button>
                    </div>
                </div>`;
            }).join('');

            // Atualiza select de postos
            const select = document.getElementById('func-posto-select');
            select.innerHTML = '<option value="">Selecione Posto...</option>' + 
                localDB.postos.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
            
            renderCards();
            updateStats();
        }

        // Funções de Status Solicitadas
        async function setInativo(id) {
            if(confirm("Deseja inativar este agente? Ele será removido do posto atual.")) {
                await _supabase.from('equipe').update({ posto_id: null }).eq('id', id);
                await sync();
            }
        }

        async function setAfastado(id) {
            const dataStr = new Date().toISOString().split('T')[0];
            if(confirm("Deseja marcar este agente como AFASTADO (AF) a partir de hoje?")) {
                await _supabase.from('ocorrencias').upsert({ agente_id: id, data: dataStr, sigla: 'AF' });
                await sync();
            }
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = localDB.postos.map(p => {
                const ags = localDB.equipe.filter(e => e.posto_id === p.id).length;
                return `<div class="card ${ags >= p.minimo ? 'active-status' : ''}" onclick="openEscala('${p.id}')">
                    <h3>${p.nome}</h3>
                    <p>${ags}/${p.minimo} Operacionais</p>
                </div>`;
            }).join('');
        }

        function updateStats() {
            document.getElementById('stat-postos').innerText = localDB.postos.length;
            document.getElementById('stat-agentes').innerText = localDB.equipe.length;
        }

        async function addAgente() {
            const nome = document.getElementById('func-nome').value;
            const posto = document.getElementById('func-posto-select').value;
            const escala = document.getElementById('func-escala').value;
            const inicio = document.getElementById('func-inicio').value;
            if(nome && inicio) {
                await _supabase.from('equipe').insert([{ nome, posto_id: posto || null, escala, inicio }]);
                sync();
            }
        }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function filterEquipe() {
            const t = document.getElementById('search-equipe').value.toLowerCase();
            document.querySelectorAll('#lista-equipe .list-item').forEach(i => {
                i.style.display = i.innerText.toLowerCase().includes(t) ? "" : "none";
            });
        }

        function closeModal() { document.getElementById('modal-escala').style.display = 'none'; }

        window.onload = sync;
    </script>
</body>
</html>
