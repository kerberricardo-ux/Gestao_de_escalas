<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinela - Gestão de Escalas Operacionais</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent: #00e676;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --danger: #ef4444;
            --warning: #f97316;
            --info: #3b82f6;
            --border: #333;
            --cor-t: #22c55e;
            --cor-fo: #000000;
            --cor-f: #ef4444;
            --cor-su: #ea580c;
            --cor-at: #06b6d4;
            --cor-fe: #3b82f6;
            --cor-hi: #16a34a;
            --cor-fg: #84cc16;
            --cor-c: #f97316;
            --cor-af: #8b5cf6;
            --cor-tc: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); display: flex; min-height: 100vh; }

        .sidebar { width: 220px; background: #000; padding: 20px; position: fixed; height: 100vh; border-right: 1px solid var(--border); z-index: 100; }
        .logo { font-weight: 800; font-size: 1rem; color: var(--accent); margin-bottom: 40px; text-align: center; letter-spacing: 1.5px; text-transform: uppercase; }
        .sidebar button { width: 100%; background: none; border: none; color: var(--text-secondary); padding: 15px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; }
        .sidebar button:hover, .sidebar button.active-nav { background: rgba(0, 230, 118, 0.1); color: var(--accent); }

        .content { margin-left: 220px; padding: 30px; width: calc(100% - 220px); }
        section { display: none; animation: fadeIn 0.3s ease; }
        section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .stat-card h3 { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .value { font-size: 2.2rem; font-weight: bold; }
        .stat-card.alert { border-bottom-color: var(--danger); }

        .form-container { background: var(--bg-card); padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
        input, select { background: #2c2c2c; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 5px; flex: 1; min-width: 150px; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 25px; border-radius: 12px; border-left: 6px solid var(--danger); cursor: pointer; transition: 0.2s; position: relative; display: flex; flex-direction: column; justify-content: center; min-height: 120px; }
        .card.active-status { border-left-color: var(--accent); }
        .card.minimo-insuficiente { border-left-color: var(--warning) !important; animation: pulse-warning 2s infinite; }
        @keyframes pulse-warning { 0%, 100% { box-shadow: 0 0 10px rgba(249, 115, 22, 0.2); } 50% { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); } }

        .card-count { position: absolute; bottom: 12px; right: 12px; padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; border: 1px solid rgba(0, 230, 118, 0.3); }
        .btn-add, .btn-edit, .btn-save, .btn-cancel { background: var(--accent); color: #000; font-weight: bold; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; }
        .btn-edit, .btn-save { background: var(--info); color: white; }
        .btn-remove { background: var(--danger); color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal-content { background: var(--bg-card); margin: 2% auto; padding: 20px; width: 95%; max-width: 1400px; max-height: 95vh; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
        .escala-container { overflow-y: auto; padding: 10px 0; }
        .escala-row { display: grid; grid-template-columns: repeat(31, 1fr); gap: 1px; background: var(--border); padding: 5px 0; }
        .sigla-cell { background: var(--bg-card); text-align: center; min-height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 0.8rem; border-radius: 3px; }

        /* Siglas Colors */
        .sigla-T { background: var(--cor-t) !important; color: white; }
        .sigla-F { background: var(--cor-f) !important; color: white; }
        .sigla-SU { background: var(--cor-su) !important; color: white; }
        .sigla-AT { background: var(--cor-at) !important; color: white; }
        .sigla-FO { background: var(--cor-fo) !important; color: #555; }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">SENTINELA</div>
        <button onclick="showSection('dashboard_gerencial')" id="nav-dashboard_gerencial" class="active-nav">
            <span class="material-icons">analytics</span> <span>Gerencial</span>
        </button>
        <button onclick="showSection('dashboard')" id="nav-dashboard">
            <span class="material-icons">monitor_heart</span> <span>Tempo Real</span>
        </button>
        <button onclick="showSection('postos')" id="nav-postos">
            <span class="material-icons">business</span> <span>Postos</span>
        </button>
        <button onclick="showSection('equipe')" id="nav-equipe">
            <span class="material-icons">groups</span> <span>Equipe</span>
        </button>
    </nav>

    <main class="content">
        <!-- SEÇÃO GERENCIAL -->
        <section id="dashboard_gerencial" class="active">
            <div class="stats-header">
                <h2>Resumo Gerencial</h2>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button onclick="alterarDia(-1)" class="btn-edit">◀</button>
                    <div id="current-date-gerencial" style="font-weight: bold; color: var(--accent); min-width: 150px; text-align: center;"></div>
                    <button onclick="alterarDia(1)" class="btn-edit">▶</button>
                </div>
            </div>

            <div class="form-container" style="background: rgba(255,255,255,0.05);">
                <select id="filtro-posto-gerencial" onchange="renderGerencial()">
                    <option value="">Todas as Unidades</option>
                </select>
                <select id="filtro-ocorrencia-gerencial" onchange="renderGerencial()">
                    <option value="">Todas as Ausências</option>
                    <option value="F">Apenas Faltas (F)</option>
                    <option value="SU">Apenas Suspensões (SU)</option>
                    <option value="AT">Apenas Atestados (AT)</option>
                </select>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><h3>Postos</h3><div class="value" id="stat-postos">0</div></div>
                <div class="stat-card"><h3>Efetivo</h3><div class="value" id="stat-agentes">0</div></div>
                <div class="stat-card alert"><h3>Faltas</h3><div class="value" id="stat-faltas">0</div></div>
                <div class="stat-card alert"><h3>Suspensões</h3><div class="value" id="stat-suspensoes">0</div></div>
                <div class="stat-card"><h3>Atestados</h3><div class="value" id="stat-atestados">0</div></div>
            </div>

            <div class="grid-cards">
                <div class="stat-card" style="text-align: left; border-bottom: none;">
                    <h3 style="margin-bottom: 15px;"><span class="material-icons">list</span> Unidades</h3>
                    <div id="lista-unidades-gestao" style="font-size: 0.9rem; line-height: 1.8; color: var(--text-secondary);"></div>
                </div>
                <div class="stat-card" style="text-align: left; border-bottom: none; border-left: 1px solid var(--border);">
                    <h3 style="margin-bottom: 15px;"><span class="material-icons">assignment_ind</span> Ausências e Ocorrências</h3>
                    <div id="lista-ausencias-gerencial" style="font-size: 0.85rem; color: var(--text-secondary);"></div>
                </div>
            </div>
        </section>

        <!-- SEÇÃO TEMPO REAL -->
        <section id="dashboard">
            <header class="stats-header">
                <h2>Painel Operacional</h2>
                <div id="current-date" style="font-weight: bold; color: var(--accent);"></div>
            </header>
            <div id="cards-container" class="grid-cards"></div>
        </section>

        <!-- SEÇÃO POSTOS -->
        <section id="postos">
            <h2>Gestão de Unidades</h2>
            <div class="form-container">
                <input type="text" id="posto-nome" placeholder="Nome da Unidade">
                <input type="number" id="posto-minimo" placeholder="Mínimo">
                <button class="btn-add" onclick="addPosto()">Criar Posto</button>
            </div>
            <div id="lista-postos"></div>
        </section>

        <!-- SEÇÃO EQUIPE -->
        <section id="equipe">
            <h2>Gestão de Agentes</h2>
            <div class="form-container">
                <input type="text" id="func-nome" placeholder="Nome Completo">
                <select id="func-posto-select"></select>
                <select id="func-escala">
                    <option value="12x36">12x36</option>
                    <option value="5x1">5x1</option>
                    <option value="6x1">6x1</option>
                </select>
                <input type="date" id="func-inicio">
                <button class="btn-add" onclick="addAgente()">Cadastrar</button>
            </div>
            <div id="lista-equipe"></div>
        </section>

        <!-- MODAL ESCALA -->
        <div id="modal-escala" class="modal">
            <div class="modal-content">
                <div class="stats-header">
                    <h3 id="modal-titulo">Escala</h3>
                    <button onclick="closeModal()" class="btn-remove">Fechar</button>
                </div>
                <div class="escala-container" id="escala-content"></div>
            </div>
        </div>
    </main>

    <script>
        const SB_URL = 'https://odvzkosujluparkblizr.supabase.co';
        const SB_KEY = 'sb_publishable_K_SPgZndx26WP11_tt6fsw_dmsD7Zou';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        let localDB = { postos: [], equipe: [], ocorrencias: {}, coberturas: {} };
        let dataSelecionada = new Date();

        function formatarDataISO(data) {
            return data.toISOString().split('T')[0];
        }

        function atualizarDataDisplay() {
            const opt = { day: '2-digit', month: 'long', year: 'numeric' };
            const txt = dataSelecionada.toLocaleDateString('pt-BR', opt);
            document.getElementById('current-date').innerText = txt;
            document.getElementById('current-date-gerencial').innerText = txt;
        }

        function alterarDia(dias) {
            dataSelecionada.setDate(dataSelecionada.getDate() + dias);
            atualizarDataDisplay();
            renderAll();
        }

        async function sync() {
            try {
                const { data: p } = await _supabase.from('postos').select('*').order('nome');
                const { data: e } = await _supabase.from('equipe').select('*').order('nome');
                const { data: o } = await _supabase.from('ocorrencias').select('*');
                const { data: c } = await _supabase.from('coberturas').select('*');

                localDB.postos = p || [];
                localDB.equipe = e || [];
                localDB.ocorrencias = {};
                localDB.coberturas = {};

                o?.forEach(occ => { localDB.ocorrencias[`${occ.agente_id}-${occ.data}`] = occ.sigla; });
                c?.forEach(cob => { localDB.coberturas[`${cob.posto_id}-${cob.data}`] = cob.nome; });

                atualizarFiltroPostos();
                renderAll();
            } catch (err) { console.error(err); }
        }

        function isTrabalho(data, inicio, escala) {
            const dI = new Date(inicio + 'T00:00:00');
            const dA = new Date(data + 'T00:00:00');
            const diff = Math.floor((dA - dI) / 86400000);
            if (diff < 0) return false;
            if (escala === '12x36') return diff % 2 === 0;
            if (escala === '5x1') return diff % 6 < 5;
            if (escala === '6x1') return diff % 7 < 6;
            return false;
        }

        function getResumoPosto(posto, dataRef) {
            const ags = localDB.equipe.filter(e => e.posto_id === posto.id);
            const minimo = posto.minimo || 1;
            const servico = ags.filter(a => {
                const sigla = localDB.ocorrencias[`${a.id}-${dataRef}`] || (isTrabalho(dataRef, a.inicio, a.escala) ? 'T' : 'FO');
                return ['T', 'HI', 'C', 'FG'].includes(sigla);
            });
            const cob = !!localDB.coberturas[`${posto.id}-${dataRef}`];
            const total = servico.length + (cob ? 1 : 0);
            return { total, minimo, suficiente: total >= minimo };
        }

        function renderGerencial() {
            const hoje = formatarDataISO(dataSelecionada);
            const postoFiltro = document.getElementById('filtro-posto-gerencial').value;
            const ocorrenciaFiltro = document.getElementById('filtro-ocorrencia-gerencial').value;

            let totalFaltas = 0, totalSu = 0, totalAt = 0;
            let ausentesHtml = '';

            // Render Unidades
            const unidadesHtml = localDB.postos
                .filter(p => !postoFiltro || p.id === postoFiltro)
                .map(p => {
                    const r = getResumoPosto(p, hoje);
                    return `• ${r.suficiente ? '✅' : '⚠️'} ${p.nome} (${r.total}/${p.minimo})`;
                }).join('<br>');
            document.getElementById('lista-unidades-gestao').innerHTML = unidadesHtml || 'Nenhuma unidade.';

            // Render Ausências - A CORREÇÃO ESTÁ AQUI
            localDB.equipe.forEach(ag => {
                // Filtro de Posto
                if (postoFiltro && ag.posto_id !== postoFiltro) return;

                const sigla = localDB.ocorrencias[`${ag.id}-${hoje}`];
                const p = localDB.postos.find(x => x.id === ag.posto_id);

                if (sigla === 'F') totalFaltas++;
                if (sigla === 'SU') totalSu++;
                if (sigla === 'AT') totalAt++;

                const siglasAusencia = ['F', 'SU', 'AT', 'FE', 'AF', 'TC'];
                if (siglasAusencia.includes(sigla)) {
                    if (!ocorrenciaFiltro || sigla === ocorrenciaFiltro) {
                        ausentesHtml += `
                            <div style="margin-bottom:8px; padding:5px; border-bottom:1px solid #333;">
                                <b style="color:var(--cor-${sigla.toLowerCase()})">[${sigla}]</b> ${ag.nome}
                                <br><small>Unidade: ${p?.nome || 'S/P'}</small>
                            </div>`;
                    }
                }
            });

            document.getElementById('stat-postos').innerText = localDB.postos.length;
            document.getElementById('stat-agentes').innerText = localDB.equipe.length;
            document.getElementById('stat-faltas').innerText = totalFaltas;
            document.getElementById('stat-suspensoes').innerText = totalSu;
            document.getElementById('stat-atestados').innerText = totalAt;
            document.getElementById('lista-ausencias-gerencial').innerHTML = ausentesHtml || '<small>Sem ausências registradas.</small>';
        }

        function renderAll() {
            renderGerencial();
            const hoje = formatarDataISO(dataSelecionada);
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            localDB.postos.forEach(p => {
                const r = getResumoPosto(p, hoje);
                const card = document.createElement('div');
                card.className = `card ${r.total > 0 ? 'active-status' : ''} ${!r.suficiente ? 'minimo-insuficiente' : ''}`;
                card.innerHTML = `<h3>${p.nome}</h3><p>${r.total > 0 ? 'OPERACIONAL' : 'VAGO'}</p>
                                 <div class="card-count">${r.total}/${p.minimo} EFETIVO</div>`;
                card.onclick = () => openEscala(p.id);
                container.appendChild(card);
            });

            document.getElementById('lista-postos').innerHTML = localDB.postos.map(p => `
                <div class="form-container" style="justify-content:space-between">
                    <span>${p.nome} (Mín: ${p.minimo})</span>
                    <button class="btn-remove" onclick="removePosto('${p.id}')">Excluir</button>
                </div>`).join('');

            document.getElementById('lista-equipe').innerHTML = localDB.equipe.map(e => `
                <div class="form-container" style="justify-content:space-between">
                    <span>${e.nome} (${e.escala})</span>
                    <button class="btn-remove" onclick="removeAgente('${e.id}')">Remover</button>
                </div>`).join('');

            const select = localDB.postos.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
            document.getElementById('func-posto-select').innerHTML = '<option value="">Selecione...</option>' + select;
        }

        function atualizarFiltroPostos() {
            const f = document.getElementById('filtro-posto-gerencial');
            const val = f.value;
            f.innerHTML = '<option value="">Todas as Unidades</option>' + 
                localDB.postos.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
            f.value = val;
        }

        function openEscala(postoId) {
            const p = localDB.postos.find(x => x.id === postoId);
            document.getElementById('modal-titulo').innerText = `Escala: ${p.nome}`;
            const mes = dataSelecionada.getMonth(), ano = dataSelecionada.getFullYear();
            const diasMes = new Date(ano, mes + 1, 0).getDate();
            const ags = localDB.equipe.filter(e => e.posto_id === postoId);
            
            let html = '';
            ags.forEach(ag => {
                html += `<div style="margin-bottom:15px;"><p><b>${ag.nome}</b></p><div class="escala-row">`;
                for(let i=1; i<=diasMes; i++) {
                    const dStr = `${ano}-${String(mes+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                    const sigla = localDB.ocorrencias[`${ag.id}-${dStr}`] || (isTrabalho(dStr, ag.inicio, ag.escala) ? 'T' : 'FO');
                    html += `<div class="sigla-cell sigla-${sigla}" onclick="setSigla('${ag.id}','${dStr}','${postoId}')">${sigla}</div>`;
                }
                html += `</div></div>`;
            });
            document.getElementById('escala-content').innerHTML = html || 'Sem agentes.';
            document.getElementById('modal-escala').style.display = 'block';
        }

        async function setSigla(id, data, pId) {
            const s = prompt("Sigla (T, FO, F, SU, AT, FE, AF, TC ou L para limpar):")?.toUpperCase();
            if(!s) return;
            if(s === 'L') await _supabase.from('ocorrencias').delete().match({agente_id:id, data});
            else await _supabase.from('ocorrencias').upsert({agente_id:id, data, sigla:s});
            await sync(); openEscala(pId);
        }

        async function addPosto() {
            const n = document.getElementById('posto-nome').value, m = document.getElementById('posto-minimo').value;
            if(n && m) { await _supabase.from('postos').insert({nome:n, minimo:m}); sync(); }
        }

        async function addAgente() {
            const n = document.getElementById('func-nome').value, p = document.getElementById('func-posto-select').value, 
                  e = document.getElementById('func-escala').value, i = document.getElementById('func-inicio').value;
            if(n && p && i) { await _supabase.from('equipe').insert({nome:n, posto_id:p, escala:e, inicio:i}); sync(); }
        }

        async function removePosto(id) { if(confirm("Excluir?")) { await _supabase.from('postos').delete().eq('id',id); sync(); } }
        async function removeAgente(id) { if(confirm("Remover?")) { await _supabase.from('equipe').delete().eq('id',id); sync(); } }

        function showSection(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active-nav'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-'+id).classList.add('active-nav');
        }

        function closeModal() { document.getElementById('modal-escala').style.display = 'none'; }

        window.onload = () => { atualizarDataDisplay(); sync(); };
    </script>
</body>
</html>
